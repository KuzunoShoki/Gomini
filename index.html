                <div class="flex-1 space-y-1">

                        うす！あいまい検索とおちゃめなクソ回答を搭載した <strong>Gomini v5.2</strong> だよ！<br>

        <!-- Bottom Input Bar -->

                    <textarea 
                        id="user-input" 
                        rows="1" 
                        placeholder="メッセージを入力... (Enterで送信)"

    <!-- Application Script (v5.2 Engine) -->
    <script>
        class GominiApp {
            constructor() {
                this.db = { config: {}, dictionary: [], knowledge: [] };
                this.history = [];
                this.memory = { userName: null, customKnowledge: {} };
                this.device = null;
            }

            async init() {
                this.setupResponsiveLayout();
                await this.loadDatabase();
                this.loadLocalStorage();
                this.initUI();
                this.renderHistory();
                this.updateDashboard();
            }

            setupResponsiveLayout() {
                const mobileQuery = window.matchMedia('(max-width: 767px)');
                const coarsePointerQuery = window.matchMedia('(pointer: coarse)');
                const visualViewport = window.visualViewport;

                const detectDevice = () => {
                    const userAgentDataMobile = navigator.userAgentData && navigator.userAgentData.mobile;
                    const userAgentMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
                    const isMobile = Boolean(
                        userAgentDataMobile ||
                        userAgentMobile ||
                        (mobileQuery.matches && coarsePointerQuery.matches)
                    );
                    this.device = isMobile ? 'mobile' : 'pc';
                    document.body.classList.toggle('device-mobile', isMobile);
                    document.body.classList.toggle('device-pc', !isMobile);
                    document.body.dataset.device = this.device;

                    const viewportHeight = visualViewport ? visualViewport.height : window.innerHeight;
                    document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);

                    const statusText = document.querySelector('#status-indicator span:last-child');
                    if (statusText) {
                        statusText.textContent = isMobile ? 'スマホモード・準備完了' : 'PCモード・準備完了';
                    }
                };

                detectDevice();
                window.addEventListener('resize', detectDevice, { passive: true });
                window.addEventListener('orientationchange', detectDevice, { passive: true });
                if (visualViewport) {
                    visualViewport.addEventListener('resize', detectDevice, { passive: true });
                }
                if (mobileQuery.addEventListener) {
                    mobileQuery.addEventListener('change', detectDevice);
                    coarsePointerQuery.addEventListener('change', detectDevice);
                }
            }

            async loadDatabase() {
                try {
                    const res = await fetch('knowledge.json');
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    this.db = await res.json();
                    document.getElementById('db-status').textContent = "同期完了";
                    document.getElementById('db-status').className = "font-mono text-emerald-400";
                } catch (e) {
                    console.warn("knowledge.json読み込み失敗。フォールバック使用。", e);
                    document.getElementById('db-status').textContent = "内蔵フォールバック";
                    document.getElementById('db-status').className = "font-mono text-amber-400";
                    this.db = {
                        config: { name: "Gomini", version: "5.2", maxHistory: 50 },
                        dictionary: [
                            { category: "greeting", keywords: ["こんにちは", "おはよう"], responses: ["こんにちは！"] }
                        ],
                        knowledge: [
                            { category: "trivia", title: "バカとアホの違い", keywords: ["バカとアホ", "ばかとあほ"], content: "関東と関西でニュアンスが違うのが面白いところだよ！" }
                        ]
                    };
                }
            }

            loadLocalStorage() {
                try {
                    const savedHistory = localStorage.getItem('gomini_history');
                    if (savedHistory) this.history = JSON.parse(savedHistory);

                    const savedMemory = localStorage.getItem('gomini_memory');
                    if (savedMemory) this.memory = JSON.parse(savedMemory);
                } catch (e) {
                    console.error("LocalStorage読込エラー:", e);
                }
            }

            saveState() {
                try {
                    const maxH = this.db.config.maxHistory || 50;
                    if (this.history.length > maxH) {
                        this.history = this.history.slice(this.history.length - maxH);
                    }
                    localStorage.setItem('gomini_history', JSON.stringify(this.history));
                    localStorage.setItem('gomini_memory', JSON.stringify(this.memory));
                } catch (e) {
                    console.error("LocalStorage保存エラー:", e);
                }
            }

            normalize(text) {
                return text.toLowerCase()
                    .replace(/[！!？?。、,．. ・　]/g, '')
                    .trim();
            }

            isKeywordMatch(input, keyword) {
                const cleanInput = this.normalize(input);
                const cleanKeyword = this.normalize(keyword);
                if (!cleanInput || !cleanKeyword) return false;
                if (cleanInput === cleanKeyword) return true;

                // 1〜2文字の略語は、別の単語の一部として解釈しない。
                const isShortLatinKeyword = /^[a-z0-9]+$/i.test(cleanKeyword) && cleanKeyword.length < 3;
                return cleanKeyword.length >= 3 &&
                    !isShortLatinKeyword &&
                    cleanInput.includes(cleanKeyword);
            }

            // N-gram（2文字スライス）による文字列類似度算出（あいまい判定用）
            getSimilarityScore(textA, textB) {
                const cleanA = this.normalize(textA);
                const cleanB = this.normalize(textB);
                if (!cleanA || !cleanB) return 0;

                if (cleanA === cleanB) return 1.0;
                if (cleanA.length < 2 || cleanB.length < 2) return 0;

                // 短い英字略語や1文字入力による誤検出を防ぐ。
                const isShortLatinKeyword = /^[a-z0-9]+$/i.test(cleanB) && cleanB.length < 3;
                if (isShortLatinKeyword) return 0;
                if (cleanA.includes(cleanB) && cleanB.length >= 3) return 0.95;
                if (cleanB.includes(cleanA) && cleanA.length >= 3) return 0.85;
                if (cleanA.length < 3 || cleanB.length < 3) return 0;

                let matches = 0;
                for (let i = 0; i < cleanA.length - 1; i++) {
                    const gram = cleanA.substring(i, i + 2);
                    if (cleanB.includes(gram)) matches++;
                }
                return (2.0 * matches) / (cleanA.length + cleanB.length);
            }

            // メイン会話エンジン
            async processInput(rawInput) {
                const input = rawInput.trim();
                if (!input) return "何かメッセージを入力してね！";

                const normInput = this.normalize(input);

                // 1. ユーザー名記憶
                const nameMatch = input.match(/(?:僕|私|俺|わたし|ぼく)の名前は(.+?)(?:です|だ|だよ|！|!|$)/);
                if (nameMatch) {
                    const name = nameMatch[1].trim();
                    this.memory.userName = name;
                    this.saveState();
                    return `覚えたよ！君の名前は ${name} さんだね！`;
                }

                if (/(僕|私|俺|わたし|ぼく)の名前(は|わ|は何)/.test(input)) {
                    return this.memory.userName ? `君の名前は ${this.memory.userName} さんだよ！ちゃんと覚えているよ。` : "まだ名前を聞いてない気がする！「僕の名前は〇〇です」って教えてね。";
                }

                // 2. 会話辞書（dictionary）の判定
                for (const dict of this.db.dictionary) {
                    for (const kw of dict.keywords) {
                        if (this.isKeywordMatch(normInput, kw)) {
                            const responses = dict.responses;
                            return responses[Math.floor(Math.random() * responses.length)];
                        }
                    }
                }

                // 3. ローカル知識（knowledge.json）のスコアリング（あいまい）検索
                let bestMatch = null;
                let highestScore = 0;

                for (const item of this.db.knowledge) {
                    for (const kw of item.keywords) {
                        const score = this.getSimilarityScore(normInput, kw);
                        if (score > highestScore) {
                            highestScore = score;
                            bestMatch = item;
                        }
                    }
                }

                if (bestMatch && highestScore >= 0.62) {
                    return `${bestMatch.title}について教えるね！\n${bestMatch.content}`;
                }

                // 4. 【比較・抽象質問ガード】辞書にない未知の比較質問をスマートに受け止める
                if (input.includes("違い") || (input.includes("と") && (input.includes("どう") || input.includes("なに")))) {
                    return `「${input}」ねぇ…！それって人や地域、文化によって解釈が変わる深いテーマだね。\n僕のローカルデータベースにはまだ確定的な答えが入ってないけど、また一つ賢くなったよ！`;
                }

                // 5. 外部検索（Wikipedia API）の意図判定
                const hasSearchIntent = /(とは|について|教えて|って何|ってなに|誰|どこ|なぜ|どう)/.test(input) || input.length >= 6;

                if (hasSearchIntent) {
                    const wikiResult = await this.searchWikipedia(input);
                    if (wikiResult) {
                        return `ローカル知識になかったから、Wikipediaで調べてきたよ！\n\n${wikiResult}`;
                    }
                }

                // 6. 愛嬌のあるフォールバック（Alexa風の冷たさを排除したお茶目な返し）
                const fallbackResponses = [
                    `うーん、「${input}」については僕のデータベースにもネットの海にも載ってなかったや！今度AI学会で聞いておくね！`,
                    `「${input}」かぁ…！なかなか深いことを聞くね。まだ勉強中だからもっと詳しく教えて！`,
                    `えっ、「${input}」？それって僕を試してる？ふふん、まだまだ成長途中なのだ！`
                ];

                return fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
            }

            // Wikipedia API連携
            async searchWikipedia(query) {
                try {
                    let term = query.replace(/(とは|について|教えて|って何|ってなに|は？|\?|？)/g, '').trim();
                    if (!term || term.length < 2) term = query;

                    const url = `https://ja.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("Wiki not found");

                    const data = await res.json();
                    if (data && data.extract && data.extract.length > 20 && !data.extract.includes("関連項目")) {
                        return `${data.title}：${data.extract} (出典: Wikipedia)`;
                    }
                } catch (e) {
                    try {
                        const searchUrl = `https://ja.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=1&format=json&origin=*`;
                        const res = await fetch(searchUrl);
                        const data = await res.json();
                        if (data && data[2] && data[2].length > 0 && data[2][0]) {
                            return `${data[1][0]}：${data[2][0]} (出典: Wikipedia)`;
                        }
                    } catch (err) {
                        console.warn("Wikipedia検索失敗:", err);
                    }
                }
                return null;
            }

            // UI処理
            initUI() {
                const chatForm = document.getElementById('chat-form');
                const userInput = document.getElementById('user-input');

                userInput.addEventListener('input', () => {
                    userInput.style.height = 'auto';
                    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
                });

                chatForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const text = userInput.value.trim();
                    if (!text) return;

                    this.appendMessage('user', text);
                    userInput.value = '';
                    userInput.style.height = 'auto';

                    const indicatorId = this.appendIndicator();

                    setTimeout(async () => {
                        const reply = await this.processInput(text);
                        this.removeIndicator(indicatorId);
                        this.appendMessage('assistant', reply);
                        this.updateDashboard();
                    }, 250);
                });

                userInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        chatForm.dispatchEvent(new Event('submit'));
                    }
                });

                document.querySelectorAll('.quick-chip').forEach(btn => {
                    btn.addEventListener('click', () => {
                        userInput.value = btn.textContent.trim();
                        chatForm.dispatchEvent(new Event('submit'));
                    });
                });

                const resetAction = () => {
                    if (confirm("会話履歴と保存された記憶を初期化しますか？")) {
                        this.history = [];
                        this.memory = { userName: null, customKnowledge: {} };
                        localStorage.removeItem('gomini_history');
                        localStorage.removeItem('gomini_memory');
                        document.getElementById('chat-container').innerHTML = '';
                        this.appendMessage('assistant', "ストレージを初期化しました！また一から話そうね。");
                        this.updateDashboard();
                    }
                };

                document.getElementById('reset-all-btn').addEventListener('click', resetAction);
                document.getElementById('reset-btn-mobile').addEventListener('click', resetAction);
            }

            appendMessage(role, text) {
                this.history.push({ role, text, timestamp: Date.now() });
                this.saveState();

                const container = document.getElementById('chat-container');
                const isUser = role === 'user';
                const div = document.createElement('div');
                div.className = `flex space-x-2.5 max-w-3xl ${isUser ? 'justify-end ml-auto' : ''}`;

                const escapedText = this.escapeHTML(text).replace(/\n/g, '<br>');

                if (isUser) {
                    div.innerHTML = `
                        <div class="flex-1 space-y-1 text-right min-w-0">
                            <div class="flex items-center justify-end space-x-1.5">
                                <span class="text-[10px] text-slate-500">You</span>
                                <span class="text-xs font-semibold text-brand-400">ユーザー</span>
                            </div>
                            <div class="inline-block bg-brand-600 text-slate-950 font-medium rounded rounded-tr-none p-2.5 text-sm text-left shadow-sm break-words">
                                ${escapedText}
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded bg-slate-800 flex items-center justify-center text-slate-200 font-bold shrink-0 shadow-sm">
                            <i class="fa-solid fa-user text-xs"></i>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="w-7 h-7 rounded bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-slate-950 font-bold shrink-0 shadow">
                            <i class="fa-solid fa-face-laugh-wink text-xs"></i>
                        </div>
                        <div class="flex-1 space-y-1 min-w-0">
                            <div class="flex items-center space-x-1.5">
                                <span class="text-xs font-semibold text-slate-200">Gomini</span>
                                <span class="text-[10px] text-slate-500 font-mono">v5.2</span>
                            </div>
                            <div class="bg-slate-900 border border-brand-900/40 rounded rounded-tl-none p-3 text-slate-200 text-sm leading-relaxed shadow-sm whitespace-pre-wrap break-words">
                                ${escapedText}
                            </div>
                        </div>
                    `;
                }

                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            }

            appendIndicator() {
                const container = document.getElementById('chat-container');
                const id = 'ind-' + Date.now();
                const div = document.createElement('div');
                div.id = id;
                div.className = 'flex space-x-2.5 max-w-3xl';
                div.innerHTML = `
                    <div class="w-7 h-7 rounded bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-slate-950 font-bold shrink-0 shadow">
                        <i class="fa-solid fa-face-laugh-wink text-xs"></i>
                    </div>
                    <div class="flex-1 space-y-1">
                        <div class="bg-slate-900 border border-brand-900/40 rounded rounded-tl-none p-2.5 text-slate-400 text-xs shadow-sm flex items-center space-x-2">
                            <i class="fa-solid fa-circle-notch animate-spin text-brand-400"></i>
                            <span>思考中...</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
                return id;
            }

            removeIndicator(id) {
                const el = document.getElementById(id);
                if (el) el.remove();
            }

            renderHistory() {
                if (this.history.length === 0) return;
                const container = document.getElementById('chat-container');
                container.innerHTML = '';
                
                for (const h of this.history) {
                    const isUser = h.role === 'user';
                    const div = document.createElement('div');
                    div.className = `flex space-x-2.5 max-w-3xl ${isUser ? 'justify-end ml-auto' : ''}`;
                    const escapedText = this.escapeHTML(h.text).replace(/\n/g, '<br>');

                    if (isUser) {
                        div.innerHTML = `
                            <div class="flex-1 space-y-1 text-right min-w-0">
                                <div class="flex items-center justify-end space-x-1.5">
                                    <span class="text-[10px] text-slate-500">You</span>
                                    <span class="text-xs font-semibold text-brand-400">ユーザー</span>
                                </div>
                                <div class="inline-block bg-brand-600 text-slate-950 font-medium rounded rounded-tr-none p-2.5 text-sm text-left shadow-sm break-words">
                                    ${escapedText}
                                </div>
                            </div>
                            <div class="w-7 h-7 rounded bg-slate-800 flex items-center justify-center text-slate-200 font-bold shrink-0 shadow-sm">
                                <i class="fa-solid fa-user text-xs"></i>
                            </div>
                        `;
                    } else {
                        div.innerHTML = `
                            <div class="w-7 h-7 rounded bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-slate-950 font-bold shrink-0 shadow">
                                <i class="fa-solid fa-face-laugh-wink text-xs"></i>
                            </div>
                            <div class="flex-1 space-y-1 min-w-0">
                                <div class="flex items-center space-x-1.5">
                                    <span class="text-xs font-semibold text-slate-200">Gomini</span>
                                    <span class="text-[10px] text-slate-500 font-mono">v5.2</span>
                                </div>
                                <div class="bg-slate-900 border border-brand-900/40 rounded rounded-tl-none p-3 text-slate-200 text-sm leading-relaxed shadow-sm whitespace-pre-wrap break-words">
                                    ${escapedText}
                                </div>
                            </div>
                        `;
                    }
                    container.appendChild(div);
                }
                container.scrollTop = container.scrollHeight;
            }

            updateDashboard() {
                document.getElementById('user-name-display').textContent = this.memory.userName || "未設定";
                document.getElementById('history-count').textContent = this.history.length + " 件";
            }

            escapeHTML(str) {
                return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.gomini = new GominiApp();
            window.gomini.init();
        });
    </script>
</body>
</html>
